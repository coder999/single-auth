name: Migrate single_auth (production)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dbmate (CGO_ENABLED=0)
        run: |
          set -euo pipefail
          # Prebuilt dbmate releases are cgo-enabled (for optional SQLite
          # support, unused here) and reserve enough virtual memory at
          # process startup to exceed this IONOS account's hard 768MB
          # `ulimit -v` ceiling — the binary panics with "pthread_create
          # failed: Resource temporarily unavailable" before dbmate's own
          # logic ever runs (confirmed directly over SSH; same fix already
          # in place for the `dash` project — see its README for the full
          # writeup). A CGO_ENABLED=0 build has a small enough footprint to
          # start cleanly under that limit; MySQL support is pure Go either
          # way, only the (unused) SQLite driver needs cgo.
          mkdir -p "$GITHUB_WORKSPACE/bin"
          git clone --depth 1 https://github.com/amacneil/dbmate.git /tmp/dbmate-src
          (cd /tmp/dbmate-src && CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/bin/dbmate" .)
          chmod +x "$GITHUB_WORKSPACE/bin/dbmate"
          "$GITHUB_WORKSPACE/bin/dbmate" --version

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # %s\n (not just %s): GitHub Actions' secrets substitution strips
          # a secret's own trailing newline, and OpenSSH's parser for the
          # OPENSSH PRIVATE KEY format requires one after the END line —
          # without it, ssh fails with "error in libcrypto" even though the
          # key is otherwise byte-for-byte correct. Appending our own \n
          # guarantees it regardless of what the secret's stored value has.
          printf '%s\n' "${{ secrets.IONOS_SSH_KEY }}" > ~/.ssh/ionos_deploy_key
          chmod 600 ~/.ssh/ionos_deploy_key
          ssh-keyscan -p "${{ secrets.IONOS_PORT || 22 }}" "${{ secrets.IONOS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship dbmate + migrations to IONOS
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'src/' \
            --exclude 'tests/' --exclude 'vendor/' --exclude 'composer.*' \
            --exclude 'README.md' --exclude 'phpunit.xml' \
            -e "ssh -i ~/.ssh/ionos_deploy_key -o IdentitiesOnly=yes -p ${{ secrets.IONOS_PORT || 22 }}" \
            ./ "${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:${{ secrets.IONOS_TARGET }}/"

      - name: Run migrations
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          IONOS_TARGET: ${{ secrets.IONOS_TARGET }}
        run: |
          set -euo pipefail
          DB_USER_ENC=$(jq -rn --arg v "$DB_USER" '$v|@uri')
          DB_PASS_ENC=$(jq -rn --arg v "$DB_PASS" '$v|@uri')
          DATABASE_URL="mysql://${DB_USER_ENC}:${DB_PASS_ENC}@${DB_HOST}:${DB_PORT:-3306}/${DB_NAME}"
          ssh -i ~/.ssh/ionos_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "${{ secrets.IONOS_PORT || 22 }}" \
            "${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}" \
            "DATABASE_URL='$DATABASE_URL' '$IONOS_TARGET/bin/dbmate' --migrations-dir '$IONOS_TARGET/db/migrations' up"
